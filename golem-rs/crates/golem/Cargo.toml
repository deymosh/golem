[package]
name = "golem"
description = "One portable front door for the local model server: results, console, tuner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# golem-core is the workspace's own logic; axum/tokio are the console's
# server (phase 2). Nothing else is added without a phase that needs it.
[dependencies]
golem-core = { path = "../golem-core" }
axum = "0.7"
# process/time: the controls spawn the shell drivers and poll them.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "io-util"] }
# The full-screen console (phase 5).
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
# ratatui's TestBackend renders into a buffer, so the TUI is testable
# without a terminal.
ratatui = "0.29"
