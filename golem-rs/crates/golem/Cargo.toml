[package]
name = "golem"
description = "Golem: install, tune and serve one local model for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# golem-core is the workspace's own logic; axum/tokio are the console's
# server. Nothing else is added without a feature that needs it.
[dependencies]
golem-core = { path = "../golem-core" }
axum = "0.7"
# fs: the console reads its page and its records asynchronously. signal:
# `golem service` stops the engine it owns when it is interrupted, which is
# what keeps a Ctrl+C from leaving a model resident.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "io-util", "signal"] }
# The full-screen console.
ratatui = "0.29"
crossterm = "0.28"

# The native window and the tray (`--features desktop`): a webview showing the
# console the service hosts, and the tray icon on the same event loop. Off by
# default, so a server or a container builds with no GUI libraries.
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
tray-icon = { version = "0.19", optional = true }

[features]
desktop = ["dep:tao", "dep:wry", "dep:tray-icon"]

[dev-dependencies]
# ratatui's TestBackend renders into a buffer, so the TUI is testable
# without a terminal.
ratatui = "0.29"

# build.rs draws the executable's icon from the mark.
[build-dependencies]
golem-core = { path = "../golem-core" }

# The windowed launcher: a GUI-subsystem program, so starting it opens no
# console. It starts `golem app` beside it and exits.
[[bin]]
name = "golemw"
path = "src/bin/golemw.rs"
required-features = ["desktop"]
