; Golem engine adapter: Strata (github.com/Niko1221/Strata) - its own
; ggml-derived C++ engine for MoE on one GPU (VRAM expert cache, MTP drafts),
; behind a Python API server (serve/server.py: /v1/messages,
; /v1/chat/completions, /health). Not a llama.cpp fork, so no flag
; translation: launcher = strata makes start-windows.ps1 install it with
; Strata's own setup and start its server.
;
; Install (first start, or after bumping build): shallow clone of the tag into
; .local/engines/strata/<build>/, then its setup.py headless (--yes --no-start)
; with the family/model below. Setup makes a private .venv (Python 3.10+ from
; the py launcher; installs Python for the user only if none exists),
; downloads the ready-made engine and the model into .local/engines/strata/data
; and writes the strata-*.json config the server runs.
;
; Not eval-gated yet. Models: Strata runs the catalog files of a family;
; qwen36 = unsloth/Qwen3.6-35B-A3B-MTP-GGUF UD-Q4_K_XL (22.85 GB). Its
; --inspect accepts Ornith-1.5 (same qwen35moe arch) for --gguf-dir use.
; Vendor numbers on an RTX 3060 12 GB: 64 tok/s single request vs llama.cpp
; 41.1 (their llama.cpp run had no MTP; ours does ~60) - to be measured here.

name = strata
build = v0.1.45
launcher = strata
source_repo = Niko1221/Strata
strata_family = qwen36
strata_model = UD-Q4_K_XL
api_anthropic = true
api_openai = true
router = false
mtp = true
fit = false
strata_context = 236544
strata_vram_reserve = 2200

; Strata serves the model its own setup installed and takes none of our
; flags, so the offload sweep does not apply: it is compared, not tuned.
tune = false
tune_reason = serves its own catalog model and ignores preset flags
