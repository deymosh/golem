; Golem engine adapter: ik_llama.cpp (ikawrakow's llama.cpp fork: fused
; DeltaNet for qwen35moe, MTP, IQK quants, faster prefill for CPU-resident
; MoE experts). Upstream publishes no binaries; Windows builds come from
; Thireus' fork, rolling tags main-b<N>-<sha>, server + cudart zip pairs per
; CPU variant. avx2 = the generic x64 build (any CPU from Haswell on; the
; avx512 variants need AVX-512, which Alder/Raptor Lake desktop chips lack).
; Keys: see engines/llama.cpp/engine.ini.
;
; Not eval-gated yet: ENGINE=ik_llama.cpp is experimental until a paired
; golem bench + golem eval --long 200000 PASS is recorded.
; Caveat: Unsloth UD/_XL GGUFs (f32/f16 tensors) may not load; official
; quants (e.g. Ornith Q4_K_M) are fine.

name = ik_llama.cpp
build = main-b5483-3d9321e
windows_repo = Thireus/ik_llama.cpp
windows_asset_cuda = ^ik_llama-main-.*-bin-win-cuda-13\.\d+-x64-avx2\.zip$
windows_runtime_cuda = ^ik_llama-cudart-main-.*-bin-win-cuda-13\.\d+-x64-avx2\.zip$
server = llama-server.exe
api_anthropic = false
api_openai = true
router = false
mtp = true
fit = true
log_file_adds_ext = true

; Flag translation, from ik's llama-server --help (main-b5483). Missing
; equivalents are dropped with a warning: no idle unload (sleep-idle-
; seconds) under this engine.
flag.n-gpu-layers = --gpu-layers
flag.log-colors = -
flag.sleep-idle-seconds = -
flag.fit-target = --fit-margin
map.spec-type.draft-mtp = --spec-type mtp
map.load-mode.mlock = --mlock
map.load-mode.mmap = -
map.load-mode.auto = -
map.fit.on = --fit
map.fit.off = -
map.n-gpu-layers.auto = -

tune = true
