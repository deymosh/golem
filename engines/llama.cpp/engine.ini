; Golem engine adapter: llama.cpp mainline (ggml-org) - the default engine.
;
; One file per engine under engines/<name>/; ENGINE in .env picks it. The
; binary reads it to install the pinned build into
; .local/engines/<name>/<build>-<backend>/ and to decide how to start it.
; Keys:
;   build             pinned release tag (gated: 200K eval PASS before bumping);
;                     ENGINE_BUILD in .env overrides, "latest" follows upstream
;   <platform>_repo   GitHub owner/repo whose releases carry this platform's
;                     archives - `windows_repo`, `linux_repo`, `macos_repo`.
;                     The platform is read from the machine, never configured.
;   <platform>_asset_*   regex of the server archive per GPU backend
;                     (cuda / rocm / metal)
;   <platform>_runtime_* regex of an extra runtime archive extracted next to it
;                     (llama.cpp's CUDA build ships its cudart separately)
;   server            server executable, without the platform's extension
;   api_anthropic     serves /v1/messages (required for ./golem claude)
;   router            understands --models-preset (else: single-model, the
;                     default section's flags become the command line)
;   log_file_adds_ext the server appends ".log" to --log-file itself
;   flag.<key>        rename a canonical (llama.cpp) flag; "-" drops it with a
;                     warning. Applies to the launcher's own flags; preset
;                     flags are only translated when router = false (in router
;                     mode the engine reads the preset itself).
;   map.<key>.<value> replace that exact flag+value with other args ("-"
;                     drops it), e.g. map.load-mode.mlock = --mlock

name = llama.cpp
build = b11379
windows_repo = ggml-org/llama.cpp
windows_asset_cuda = ^llama-.*bin-win-cuda-13\.\d+-x64\.zip$
windows_runtime_cuda = ^cudart-llama-bin-win-cuda-13\.\d+-x64\.zip$
windows_asset_rocm = ^llama-.*bin-win-rocm-\d+\.\d+-x64\.zip$
; The same release ships the Linux archives, and they are .tar.gz - so GNU tar
; reads them and the Windows zip's bsdtar detour does not apply here.
linux_repo = ggml-org/llama.cpp
linux_asset_cuda = ^llama-.*bin-ubuntu-cuda-13\.\d+-x64\.tar\.gz$
; The Linux cudart archive carries the build tag (cudart-llama-b11379-bin-...),
; where the Windows one does not (cudart-llama-bin-win-...) - so the tag is
; eaten by the .* rather than spelled out.
linux_runtime_cuda = ^cudart-llama-.*bin-ubuntu-cuda-13\.\d+-x64\.tar\.gz$
linux_asset_rocm = ^llama-.*bin-ubuntu-rocm-\d+\.\d+-x64\.tar\.gz$
macos_repo = ggml-org/llama.cpp
macos_asset_metal = ^llama-.*bin-macos-.*\.tar\.gz$
server = llama-server
api_anthropic = true
api_openai = true
router = true
mtp = true
fit = true
tune = true
