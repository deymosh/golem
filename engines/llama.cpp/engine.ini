; Golem engine adapter: llama.cpp mainline (ggml-org) - the default engine.
;
; One file per engine under engines/<name>/; ENGINE in .env picks it. The
; launchers read it to install the pinned build into
; .local/engines/<name>/<build>-<backend>/ and to decide how to start it.
; Keys:
;   build             pinned release tag (gated: 200K eval PASS before bumping);
;                     ENGINE_BUILD in .env overrides, "latest" follows upstream
;   windows_repo      GitHub owner/repo whose releases carry the Windows zips
;   windows_asset_*   regex of the server zip per GPU backend (cuda / rocm)
;   windows_runtime_* regex of an extra runtime zip extracted next to it
;   server            server executable inside the zip
;   api_anthropic     serves /v1/messages (required for ./golem claude)
;   router            understands --models-preset (else: single-model, the
;                     default section's flags become the command line)
;   log_file_adds_ext the server appends ".log" to --log-file itself
;   flag.<key>        rename a canonical (llama.cpp) flag; "-" drops it with a
;                     warning. Applies to the launcher's own flags; preset
;                     flags are only translated when router = false (in router
;                     mode the engine reads the preset itself).
;   map.<key>.<value> replace that exact flag+value with other args ("-"
;                     drops it), e.g. map.load-mode.mlock = --mlock

name = llama.cpp
build = b11379
windows_repo = ggml-org/llama.cpp
windows_asset_cuda = ^llama-.*bin-win-cuda-13\.\d+-x64\.zip$
windows_runtime_cuda = ^cudart-llama-bin-win-cuda-13\.\d+-x64\.zip$
windows_asset_rocm = ^llama-.*bin-win-rocm-\d+\.\d+-x64\.zip$
server = llama-server.exe
api_anthropic = true
api_openai = true
router = true
mtp = true
fit = true
tune = true
