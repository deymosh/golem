<script type="application/ld+json">{"@context":"http://schema.org","@type":"QAPage","name":"Elegantly/conveniantly filling arrays","datePublished":"2015-05-25T15:11:54.531Z","mainEntity":{"@type":"Question","answerCount":7,"author":{"@type":"Person","name":"hoodie","url":"https://users.rust-lang.org/u/hoodie"},"dateModified":"2015-05-25T15:11:54.617Z","datePublished":"2015-05-25T15:11:54.531Z","name":"Elegantly/conveniantly filling arrays","text":"Hi, I\u0026#39;m still a rookie, so please excuse if this is a case of DNRM.\n\nI am trying to build a chessboard by defining a 2x2 array of `enum Field(Figure, Empty).\n\nWhen I first try to fill it the compiler complained that I did not initialize it corretly. However I don\u0026#39;t find a way to initialize it other \u0026hellip;","upvoteCount":0,"suggestedAnswer":[{"@type":"Answer","author":{"@type":"Person","name":"mdup","url":"https://users.rust-lang.org/u/mdup"},"dateModified":"2015-05-25T15:17:51.612Z","datePublished":"2015-05-25T15:17:51.605Z","text":"In your particular case, you\u0026#39;re lucky, because you\u0026#39;re initializing your board array with a single element, repeated 8 times. You can achieve it as follows:\n\n#[derive(Clone, Copy)]\n\nenum Field {\n\nEmpty,\n\nFull(i32),\n\n}\n\nfn main() {\n\nlet mut board: [Field; 8] = [Field::Empty; 8];\n\n}\n\nIf you wanted\u0026hellip;","upvoteCount":1,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/2"},{"@type":"Answer","author":{"@type":"Person","name":"hoodie","url":"https://users.rust-lang.org/u/hoodie"},"dateModified":"2015-05-25T15:28:50.889Z","datePublished":"2015-05-25T15:28:50.882Z","text":"Thank you, but that means that I still have to implement the trait core::marker::Copy for Field myself right?\n\nAt least the compiler complained about it:\n\nerror: the trait core::marker::Copy is not implemented for the type Field","upvoteCount":0,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/3"},{"@type":"Answer","author":{"@type":"Person","name":"mdup","url":"https://users.rust-lang.org/u/mdup"},"dateModified":"2015-05-25T15:32:38.627Z","datePublished":"2015-05-25T15:32:38.615Z","text":"Yep; as you can see, an easy way is to let the compiler write it itself with\n\n#[derive(Clone, Copy)]\n\nI provided it in my example above, which compiles: \u003ca href=\"http://is.gd/bIQlH9\" class=\"inline-onebox\" rel=\"noopener nofollow ugc\"\u003eRust Playground\u003c/a\u003e. (I put Clone there as well because a Copy type is required to be also Clone.)","upvoteCount":0,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/4"},{"@type":"Answer","author":{"@type":"Person","name":"hoodie","url":"https://users.rust-lang.org/u/hoodie"},"dateModified":"2015-05-25T15:38:43.586Z","datePublished":"2015-05-25T15:38:43.572Z","text":"Oops, I wrote a lower case clone and copy, which is why the compiler complained.\n\nOk, everything is solved. Thank you.","upvoteCount":0,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/5"},{"@type":"Answer","author":{"@type":"Person","name":"mdup","url":"https://users.rust-lang.org/u/mdup"},"dateModified":"2015-05-25T17:09:11.577Z","datePublished":"2015-05-25T17:09:11.571Z","text":"All right, you\u0026#39;re welcome :slight_smile:","upvoteCount":1,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/6"},{"@type":"Answer","author":{"@type":"Person","name":"Nashenas88","url":"https://users.rust-lang.org/u/Nashenas88"},"dateModified":"2015-05-26T17:47:43.945Z","datePublished":"2015-05-26T17:47:43.936Z","text":"If you want a doubly-nested array, then check out \u003ca href=\"http://is.gd/t7vSuQ\" class=\"inline-onebox\" rel=\"noopener nofollow ugc\"\u003eRust Playground\u003c/a\u003e. It\u0026#39;s almost the exact same code. I also added Debug to the derive so you could see how to print out the board.","upvoteCount":0,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/7"},{"@type":"Answer","author":{"@type":"Person","name":"hoodie","url":"https://users.rust-lang.org/u/hoodie"},"dateModified":"2015-05-26T18:06:26.796Z","datePublished":"2015-05-26T18:06:26.788Z","text":"Thank you, this is basically what I did. Next step would be to implement a custom trait display for Field.","upvoteCount":1,"url":"https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/8"}]}}</script>

      transform-origin: calc((var(--splash-dot-spacing) * var(--n) * -1) + var(--splash-dot-size)/2) center;

      width: var(--splash-dot-size);
      height: var(--splash-dot-size);
      border-radius: 50%;

      background-color: var(--dot-color);
      filter: saturate(2) opacity(0.85);

        <script type="application/json" id="data-preloaded">{"topic_1555":"{\"post_stream\":{\"posts\":[{\"id\":3843,\"name\":\"Hendrik Sollich\",\"username\":\"hoodie\",\"avatar_template\":\"/user_avatar/users.rust-lang.org/hoodie/{size}/596_2.png\",\"created_at\":\"2015-05-25T15:11:54.610Z\",\"cooked\":\"\\u003cp\\u003eHi, I'm still a rookie, so please excuse if this is a case of DNRM.\\u003cbr\\u003e\\nI am trying to build a chessboard by defining a 2x2 array of `enum Field(Figure, Empty).\\u003cbr\\u003e\\nWhen I first try to fill it the compiler complained that I did not initialize it corretly. However I don't find a way to initialize it other than actually writing it out manually. All the examples in the doc only cover arrays of primitive types or up to 5 elements.\\u003cbr\\u003e\\nI hoped (coming from ruby) there would be some sort of sugar like\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-rust\\\"\\u003e   let mut board: [Field; 8] = \\n     for row in 0..8 {\\n         for col in 0..8 {\\n             Field::Empty;\\n         }\\n     } \\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003ebut that was wishful thinking \\u003cimg src=\\\"https://emoji.discourse-cdn.com/twitter/stuck_out_tongue_closed_eyes.png?v=12\\\" title=\\\":stuck_out_tongue_closed_eyes:\\\" class=\\\"emoji\\\" alt=\\\":stuck_out_tongue_closed_eyes:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eHow do I do this other than reverting to using a vector?\\u003c/p\\u003e\\n\\u003cp\\u003eThank you\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":8,\"updated_at\":\"2015-05-25T15:12:10.018Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":3033,\"reads\":147,\"readers_count\":146,\"score\":15189.4,\"yours\":false,\"topic_id\":1555,\"topic_slug\":\"elegantly-conveniantly-filling-arrays\",\"display_username\":\"Hendrik Sollich\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":657,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/elegantly-conveniantly-filling-arrays/1555/1\",\"calendar_details\":[],\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":3844,\"name\":\"Marc Dupont\",\"username\":\"mdup\",\"avatar_template\":\"/user_avatar/users.rust-lang.org/mdup/{size}/879_2.png\",\"created_at\":\"2015-05-25T15:17:51.605Z\",\"cooked\":\"\\u003cp\\u003eIn your particular case, you're lucky, because you're initializing your \\u003ccode\\u003eboard\\u003c/code\\u003e array with a single element, repeated 8 times. You can achieve it as follows:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-rust\\\"\\u003e#[derive(Clone, Copy)]\\nenum Field {\\n    Empty,\\n    Full(i32),\\n}\\n\\nfn main() {\\n   let mut board: [Field; 8] = [Field::Empty; 8];\\n}\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIf you wanted to store different elements, depending on the index for example, you would be out of luck: see the problem and some alternatives at \\u003ca href=\\\"http://stackoverflow.com/questions/26757355/how-do-i-collect-into-an-array\\\" class=\\\"inline-onebox\\\" rel=\\\"noopener nofollow ugc\\\"\\u003erust - How do I collect into an array? - Stack Overflow\\u003c/a\\u003e.\\u003c/p\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":8,\"updated_at\":\"2015-05-25T15:19:27.581Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quo               <p>Hi, I'm still a rookie, so please excuse if this is a case of DNRM.<br>
I am trying to build a chessboard by defining a 2x2 array of `enum Field(Figure, Empty).<br>
When I first try to fill it the compiler complained that I did not initialize it corretly. However I don't find a way to initialize it other than actually writing it out manually. All the examples in the doc only cover arrays of primitive types or up to 5 elements.<br>
I hoped (coming from ruby) there would be some sort of sugar like</p>
<pre><code class="lang-rust">   let mut board: [Field; 8] = 
     for row in 0..8 {
         for col in 0..8 {
             Field::Empty;
         }
     } 
</code></pre>
<p>but that was wishful thinking <img src="https://emoji.discourse-cdn.com/twitter/stuck_out_tongue_closed_eyes.png?v=12" title=":stuck_out_tongue_closed_eyes:" class="emoji" alt=":stuck_out_tongue_closed_eyes:" loading="lazy" width="20" height="20"></p>
<p>How do I do this other than reverting to using a vector?</p>
<p>Thank you</p>
            </div>



            


          </div>
          <div id='post_2' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/mdup'><span itemprop="name">mdup</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/mdup'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-25T15:17:51Z' class='post-time'>
                    May 25, 2015,  3:17pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-25T15:17:51Z'>
              <span itemprop="position">2</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>In your particular case, you're lucky, because you're initializing your <code>board</code> array with a single element, repeated 8 times. You can achieve it as follows:</p>
<pre><code class="lang-rust">#[derive(Clone, Copy)]
enum Field {
    Empty,
    Full(i32),
}

fn main() {
   let mut board: [Field; 8] = [Field::Empty; 8];
}
</code></pre>
<p>If you wanted to store different elements, depending on the index for example, you would be out of luck: see the problem and some alternatives at <a href="http://stackoverflow.com/questions/26757355/how-do-i-collect-into-an-array" class="inline-onebox" rel="noopener nofollow ugc">rust - How do I collect into an array? - Stack Overflow</a>.</p>
            </div>



            

<meta itemprop='upvoteCount' content='1'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/2'>
          </div>
          <div id='post_3' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/hoodie'><span itemprop="name">hoodie</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/hoodie'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-25T15:28:50Z' class='post-time'>
                    May 25, 2015,  3:28pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-25T15:28:50Z'>
              <span itemprop="position">3</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Thank you, but that means that I still have to implement the trait <code>core::marker::Copy</code> for <code>Field</code> myself right?<br>
At least the compiler complained about it:</p>
<blockquote>
<p>error: the trait <code>core::marker::Copy</code> is not implemented for the type <code>Field</code></p>
</blockquote>
            </div>



            

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/3'>
          </div>
          <div id='post_4' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/mdup'><span itemprop="name">mdup</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/mdup'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-25T15:32:38Z' class='post-time'>
                    May 25, 2015,  3:32pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-25T15:32:38Z'>
              <span itemprop="position">4</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Yep; as you can see, an easy way is to let the compiler write it itself with</p>
<p><code>#[derive(Clone, Copy)]</code></p>
<p>I provided it in my example above, which compiles: <a href="http://is.gd/bIQlH9" class="inline-onebox" rel="noopener nofollow ugc">Rust Playground</a>. (I put <code>Clone</code> there as well because a <code>Copy</code> type is required to be also <code>Clone</code>.)</p>
            </div>



            

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/4'>
          </div>
          <div id='post_5' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/hoodie'><span itemprop="name">hoodie</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/hoodie'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-25T15:38:43Z' class='post-time'>
                    May 25, 2015,  3:38pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-25T15:38:43Z'>
              <span itemprop="position">5</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Oops, I wrote a lower case <code>clone</code> and <code>copy</code>, which is why the compiler complained.<br>
Ok, everything is solved. Thank you.</p>
            </div>



            

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/5'>
          </div>
          <div id='post_6' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>

                <a rel='nofollow' href='https://users.rust-lang.org/u/mdup'><span itemprop="name">mdup</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/mdup'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-25T17:09:11Z' class='post-time'>
                    May 25, 2015,  5:09pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-25T17:09:11Z'>
              <span itemprop="position">6</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>All right, you're welcome <img src="https://emoji.discourse-cdn.com/twitter/slight_smile.png?v=12" title=":slight_smile:" class="emoji" alt=":slight_smile:" loading="lazy" width="20" height="20"></p>
            </div>



            

<meta itemprop='upvoteCount' content='1'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/6'>
          </div>
          <div id='post_7' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/Nashenas88'><span itemprop="name">Nashenas88</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/Nashenas88'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-26T17:47:43Z' class='post-time'>
                    May 26, 2015,  5:47pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-26T17:47:43Z'>
              <span itemprop="position">7</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>If you want a doubly-nested array, then check out <a href="http://is.gd/t7vSuQ" class="inline-onebox" rel="noopener nofollow ugc">Rust Playground</a>. It's almost the exact same code. I also added Debug to the derive so you could see how to print out the board.</p>
            </div>



            

<meta itemprop='upvoteCount' content='0'><meta itemprop='url' content='https://users.rust-lang.org/t/elegantly-conveniantly-filling-arrays/1555/7'>
          </div>
          <div id='post_8' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://users.rust-lang.org/u/hoodie'><span itemprop="name">hoodie</span></a>
                  <meta itemprop='url' content='https://users.rust-lang.org/u/hoodie'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2015-05-26T18:06:26Z' class='post-time'>
                    May 26, 2015,  6:06pm
                  </time>
                  <meta itemprop='dateModified' content='2015-05-26T18:06:26Z'>
              <span itemprop="position">8</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Thank you, this is basically what I did. Next step would be to implement a custom <code>trait display</code> for Field.</p>
