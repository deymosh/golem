# Golem - local AI stack in Docker.
#
#   docker compose --profile cuda up -d     # or --profile rocm; ./golem
#                                           # resolves GPU_BACKEND itself
#
# One inference service, two variants picked by compose profile (the golem
# script maps GPU_BACKEND to COMPOSE_PROFILES; `auto` - the default -
# detects the vendor, so plain users never set anything):
#   inference-cuda   NVIDIA
#   inference-rocm   AMD
# A bare `docker compose up` selects no profile and starts nothing - use
# ./golem, or pass --profile cuda / --profile rocm yourself.
#
# The image is this repository's Dockerfile: the golem binary, the pinned
# engine baked in by `golem install`, and `golem service --up` as PID 1.
# The ~70-line shell entrypoint this file used to carry - the third copy of
# the adapter's flag translation - is gone: the binary is the only flag
# translator now, and the image digest pin went with it, because the
# adapter's `build` already names the engine release the eval gate adopted.
#
# Service on the compose network:
#   golem-inference  golem service (owns llama-server)  -> :8000
#
# Any agent on the LAN (Claude Code, OpenCode, ...) can use the model.

name: golem

# Everything common to both GPU vendors. Only the image, its build arg and
# the GPU wiring differ, so those live in the per-backend services below.
x-inference: &inference
  container_name: golem-inference
  restart: unless-stopped

  # The binary reads its configuration from /golem/.env (golem.toml first,
  # then .env), so the host's .env configures the container the same way it
  # configures every other front door. Read-write, because `tune --adopt`
  # and the console's model edits write back to it. LOCAL_AI_HOST stays a
  # host-side concern: GOLEM_LOCAL_AI_HOST pins the in-container bind to
  # 0.0.0.0 whatever the file says, since the port is published, not
  # loopback.
  volumes:
    - ./.env:/golem/.env
    - ./data/models:/golem/data/models
    - ./data/cache:/golem/data/cache
    - ./data/tuned:/golem/data/tuned
    - ./bench:/golem/bench
    - ./logs:/golem/logs
    - ./config:/golem/config

  environment:
    GOLEM_LOCAL_AI_HOST: 0.0.0.0

  ports:
    - "${LOCAL_AI_HOST:-0.0.0.0}:${LOCAL_AI_PORT:-8000}:8000"

  # --load-mode mlock needs RLIMIT_MEMLOCK; Docker Desktop gives
  # unlimited by default but a systemd-hosted daemon may cap it
  # (8-64MB), which would silently unlock the model weights.
  ulimits:
    memlock: -1

  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 10s
    timeout: 3s
    retries: 40
    start_period: 180s

services:
  inference-cuda:
    <<: *inference
    profiles: ["cuda"]
    build:
      context: .
      args:
        GPU_BACKEND: cuda
    image: golem:cuda
    # The engine pin is the adapter's `build` (engines/llama.cpp/engine.ini),
    # gated by the 200K eval, baked in by the Dockerfile - the ghcr digest
    # this used to pin is retired with the shell entrypoint it came with.
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GOLEM_LOCAL_AI_HOST: 0.0.0.0
    gpus: all

  inference-rocm:
    <<: *inference
    profiles: ["rocm"]
    # Active when GPU_BACKEND resolves to rocm (auto-detect, or set
    # GPU_BACKEND="rocm" in .env; ./golem maps it to COMPOSE_PROFILES).
    # /dev/kfd (compute) + /dev/dri (display) grant GPU access on Linux; no
    # --gpus and no NVIDIA_* env here. The engine pin is the adapter's
    # `build`, same eval-gated rule as the CUDA one.
    build:
      context: .
      args:
        GPU_BACKEND: rocm
    image: golem:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined
