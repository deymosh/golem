# Golem - local AI stack in Docker.
#
#   docker compose up -d --remove-orphans   # or: ./golem up --docker
#
# Service on the compose network:
#   inference   llama.cpp server     -> OpenAI AND Anthropic API on :8000
#
# Any agent on the LAN (Claude Code, OpenCode, ...) can use the model.

name: golem

services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: golem-inference
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${LOCAL_AI_HOST:-0.0.0.0}:${LOCAL_AI_PORT:-8000}:8000"

    volumes:
      - ./data/models:/models:ro
      - ./data/cache:/cache

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # --load-mode mlock needs RLIMIT_MEMLOCK; Docker Desktop gives
    # unlimited by default but a systemd-hosted daemon may cap it
    # (8-64MB), which would silently unlock the model weights.
    ulimits:
      memlock: -1

    gpus: all

    # The args are expanded by a shell inside the container so that
    # $EXTRA_ARGS (from .env) can append optional llama-server flags:
    # MoE offload (--cpu-moe / --n-cpu-moe N), rope tweaks, template
    # kwargs, ... Set EXTRA_ARGS="" when not needed.
    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        exec /app/llama-server \
          --host 0.0.0.0 \
          --port 8000 \
          --model /models/${MODEL_FILE:?set MODEL_FILE in .env} \
          --alias ${MODEL_ALIAS:-local-model} \
          --ctx-size "${CONTEXT_SIZE:-32768}" \
          --n-gpu-layers "${GPU_LAYERS:-99}" \
          --threads "${CPU_THREADS:-20}" \
          --parallel "${PARALLEL:-1}" \
          --jinja \
          --metrics \
          -fa on \
          --cache-type-k "${CACHE_TYPE_K:-q8_0}" \
          --cache-type-v "${CACHE_TYPE_V:-q8_0}" \
          --load-mode "${LOAD_MODE:-auto}" \
          --api-key ${LOCAL_AI_API_KEY:-local-key} \
          $${EXTRA_ARGS}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 40
      start_period: 180s
