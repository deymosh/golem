# Golem - local AI stack in Docker.
#
#   docker compose up -d --build          # or: ./golem up --docker
#
# Services on one compose network:
#   inference   llama.cpp server     -> OpenAI AND Anthropic API on :8000
#   search      SearXNG metasearch   -> internal only (no published port)
#   mcp-search  MCP server (web search + url read) -> streamable HTTP :8811
#
# Any agent on the LAN (Claude Code, OpenCode, a remote gateway, ...) can
# use the model and the web tools; nothing depends on anything else.

name: golem

services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: golem-inference
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${LOCAL_AI_HOST:-0.0.0.0}:${LOCAL_AI_PORT:-8000}:8000"

    volumes:
      - ./data/models:/models:ro
      - ./data/cache:/cache

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # --load-mode mlock needs RLIMIT_MEMLOCK; Docker Desktop gives
    # unlimited by default but a systemd-hosted daemon may cap it
    # (8-64MB), which would silently unlock the model weights.
    ulimits:
      memlock: -1

    gpus: all

    # The args are expanded by a shell inside the container so that
    # $EXTRA_ARGS (from .env) can append optional llama-server flags:
    # MoE offload (--cpu-moe / --n-cpu-moe N), rope tweaks, template
    # kwargs, ... Set EXTRA_ARGS="" when not needed.
    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        exec /app/llama-server \
          --host 0.0.0.0 \
          --port 8000 \
          --model /models/${MODEL_FILE:?set MODEL_FILE in .env} \
          --alias ${MODEL_ALIAS:-local-model} \
          --ctx-size "${CONTEXT_SIZE:-32768}" \
          --n-gpu-layers "${GPU_LAYERS:-99}" \
          --threads "${CPU_THREADS:-20}" \
          --parallel "${PARALLEL:-1}" \
          --jinja \
          --metrics \
          -fa on \
          --cache-type-k "${CACHE_TYPE_K:-q8_0}" \
          --cache-type-v "${CACHE_TYPE_V:-q8_0}" \
          --load-mode "${LOAD_MODE:-auto}" \
          --api-key ${LOCAL_AI_API_KEY:-local-key} \
          $${EXTRA_ARGS}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 40
      start_period: 180s

  search:
    # SearXNG metasearch. Not published to the host: only mcp-search talks
    # to it over the compose network.
    image: searxng/searxng:latest
    container_name: golem-search
    restart: unless-stopped

    volumes:
      - ./config/searxng:/etc/searxng:ro

  mcp-search:
    # mcp-searxng over streamable HTTP. Tools: searxng_web_search,
    # web_url_read, searxng_search_suggestions, searxng_instance_info.
    build:
      context: ./docker
      dockerfile: mcp-search.Dockerfile
    image: golem-mcp-search:latest
    container_name: golem-mcp-search
    restart: unless-stopped

    depends_on:
      - search

    ports:
      - "${MCP_SEARCH_HOST:-0.0.0.0}:${MCP_SEARCH_PORT:-8811}:8811"

    environment:
      SEARXNG_URL: http://search:8080
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8811"
      MCP_HTTP_STATELESS: "true"
      MCP_HTTP_HARDEN: "true"
      MCP_HTTP_AUTH_TOKEN: ${MCP_SEARCH_API_KEY:-local-mcp-key}
      MCP_HTTP_ALLOWED_ORIGINS: "*"
      # Add "<lan-ip>:8811,<lan-ip>" via .env when connecting from other machines
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-localhost:8811,127.0.0.1:8811,localhost,127.0.0.1}
