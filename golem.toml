# ============================================================
# Golem - the binary's own configuration
# ============================================================
#
# This file is the source of truth for every setting whose only reader is the
# `golem` binary. `.env` is the compatibility shim: the shell drivers
# (`./golem`, `golem.cmd`, `scripts/*.ps1`, `compose.yml`) still source it, so
# a key stays there while a driver reads it, and moves here on the day the
# binary is its only reader. Nothing is ever in both - two sources of truth
# for one setting is the failure this split exists to avoid.
#
# The comments here are the documentation, which is why this is TOML and not
# JSON. The keys keep the names they had in `.env`, so a move is a move and
# not a rename: a setting someone already knows is still spelled the same way.
# They are also read with `.env`'s own semantics - every value is a string the
# reader parses - so `TUNE_RUNS = 3` and `TUNE_RUNS = "3"` mean the same thing.
#
# Everything else - the deploy mode, the port, the model, the engine, the
# preset file, the flags the launcher passes - is in `.env`, because the
# launchers read it.
# ============================================================

# ------------------------------------------------------------
# Generation defaults (used by `golem bench` and `golem eval`)
# ------------------------------------------------------------

# Sampling for the eval's throughput runs. Not the server's own defaults:
# these are what the gate measures with, so they travel with the numbers.
TEMPERATURE = 0.15
TOP_P = 0.95

# ------------------------------------------------------------
# Tuning floors (`golem tune`)
# ------------------------------------------------------------

# `./golem tune` sweeps a model's offload split and keeps the fastest setup
# that is not spilling VRAM, but "fastest here" is not the same as "usable":
# a candidate under one of these floors is dropped from the ranking however
# good it looks next to a worse one. The defaults are what real sessions
# settled on - 30 t/s at full depth felt fine, 23 was sluggish, 16.7 was
# rejected - and every one has a per-run flag (`--min-decode`, `--min-prefill`,
# `--min-depth-decode`) so a single run can move it without editing this file.
# See docs/plan-tune-model-context.md for where the numbers come from.
TUNE_MIN_DECODE = 25          # median decode, tokens/s
TUNE_MIN_PREFILL = 350        # prompt processing, tokens/s
TUNE_MIN_DEPTH_DECODE = 15    # decode at full context, tokens/s

# How far the tuner grows the context: "max" climbs until the card or the
# decode floor stops it, and stops at the model's trained context unless a
# number here (or `--ctx N`) asks for more. Extrapolating past the trained
# context works per model rather than in general, so it has to be asked for.
TUNE_CTX_POLICY = "max"

# How much a sweep spends per point. `TUNE_RUNS` is the bench's best-of-N and
# `TUNE_PREFILL` the prompt size it measures; both are `golem bench`'s own
# flags with the same meaning, and `tune --runs N` / `--prefill N` override
# them. `GATE_TOKENS` is the gate's own ceiling: the tuner asks for a needle
# at 90% of each candidate's tuned context, capped here. 200000 is the number
# Claude Code assumes, so a setup that clears it is one an agent session can
# use.
TUNE_RUNS = 3
TUNE_PREFILL = 8000
GATE_TOKENS = 200000
