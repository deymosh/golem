# Portable golem binary: test + build on the three desktop platforms.
# CI never runs models and never adopts anything (the 200K eval gate stays
# a manual, on-real-hardware check); it only proves the code builds and the
# unit tests pass. See docs/plan-portable-binary.md.

name: golem-bin

on:
  push:
    branches: [master, experiment/token-machine]
    paths: [golem-rs/**, .github/workflows/golem-bin.yml]
  pull_request:
    paths: [golem-rs/**, .github/workflows/golem-bin.yml]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: golem-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('golem-rs/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --workspace --manifest-path golem-rs/Cargo.toml
      - name: Build (release)
        run: cargo build --release --manifest-path golem-rs/Cargo.toml
      - name: Smoke
        run: ./golem-rs/target/release/golem --version
        shell: bash

  # A tag (v*) attaches the three binaries to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: golem-windows-x86_64.exe
          - os: ubuntu-latest
            asset: golem-linux-x86_64
          - os: macos-latest
            asset: golem-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path golem-rs/Cargo.toml
      - name: Rename
        shell: bash
        run: |
          src=golem-rs/target/release/golem
          [[ "${{ runner.os }}" == Windows ]] && src="${src}.exe" || true
          cp "${src}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
