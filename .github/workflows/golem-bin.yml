# Portable golem binary: test + build on the three desktop platforms.
# CI never runs models and never adopts anything (the 200K eval gate stays
# a manual, on-real-hardware check); it only proves the code builds and the
# unit tests pass. See golem-rs/README.md.

name: golem-bin

# The paths are the code and every file the binary compiles in (the page,
# the configuration template, the presets, the library, the default
# adapter). A tag push ignores the path filter: a release always builds.
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: [golem-rs/**, bench/report.template.html, config/**, engines/**, golem.toml.example, .github/workflows/golem-bin.yml]
  pull_request:
    paths: [golem-rs/**, bench/report.template.html, config/**, engines/**, golem.toml.example, .github/workflows/golem-bin.yml]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The app's window and tray on Linux: WebKitGTK, an appindicator and
      # libxdo (the tray menu). Windows and macOS use the system webview.
      - name: Desktop libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/cache@v5
        with:
          path: golem-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('golem-rs/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --workspace --manifest-path golem-rs/Cargo.toml
      - name: Build (release)
        run: cargo build --release --manifest-path golem-rs/Cargo.toml
      # The app window and tray, on every platform - on Windows with the C
      # runtime linked in, as the release is.
      - name: Build (release, desktop)
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --features desktop --manifest-path golem-rs/Cargo.toml
      # The release's plain Linux binary: static, against musl.
      - name: Build (release, static musl)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path golem-rs/Cargo.toml
          file golem-rs/target/x86_64-unknown-linux-musl/release/golem | grep -q 'static'
      - name: Smoke
        run: ./golem-rs/target/release/golem --version
        shell: bash

  # A tag (v*) attaches the three binaries to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    # Attaching the assets writes to the release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # A zip: golemw.exe (the windowed launcher) finds golem.exe by
          # name beside it, so neither can be renamed. The WebView2 loader
          # is linked in on MSVC, and the C runtime with it (crt-static), so
          # the two files are the whole install.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: golem-windows-x86_64.zip
            features: --features desktop
          # Two on Linux. The plain one is static (musl): one file that runs
          # on any distribution, a server and a container included. The
          # desktop one links the system's WebKitGTK, which a static build
          # cannot carry, and will not start where it is missing.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: golem-linux-x86_64
            features: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: golem-linux-x86_64-desktop
            features: --features desktop
          # macOS links only its own system frameworks.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: golem-macos-arm64
            features: --features desktop
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Desktop libraries (Linux)
        if: runner.os == 'Linux' && matrix.features != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }} --manifest-path golem-rs/Cargo.toml
      - name: Package
        shell: bash
        run: |
          src=golem-rs/target/${{ matrix.target }}/release/golem
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a "${{ matrix.asset }}" "${src}.exe" "${src}w.exe"
          else
            cp "${src}" "${{ matrix.asset }}"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
