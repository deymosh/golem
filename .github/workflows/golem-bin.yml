# Portable golem binary: test + build on the three desktop platforms.
# CI never runs models and never adopts anything (the 200K eval gate stays
# a manual, on-real-hardware check); it only proves the code builds and the
# unit tests pass. See golem-rs/README.md.

name: golem-bin

on:
  push:
    branches: [master, experiment/token-machine]
    paths: [golem-rs/**, .github/workflows/golem-bin.yml]
  pull_request:
    paths: [golem-rs/**, .github/workflows/golem-bin.yml]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: golem-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('golem-rs/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --workspace --manifest-path golem-rs/Cargo.toml
      - name: Build (release)
        run: cargo build --release --manifest-path golem-rs/Cargo.toml
      # The app window and tray: the system webview on Windows and macOS.
      # Linux would need WebKitGTK on the runner, so it builds without it.
      - name: Build (release, desktop)
        if: runner.os != 'Linux'
        run: cargo build --release --features desktop --manifest-path golem-rs/Cargo.toml
      - name: Smoke
        run: ./golem-rs/target/release/golem --version
        shell: bash

  # A tag (v*) attaches the three binaries to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A zip: golemw.exe (the windowed launcher) finds golem.exe by
          # name beside it, so neither can be renamed.
          - os: windows-latest
            asset: golem-windows-x86_64.zip
            features: --features desktop
          - os: ubuntu-latest
            asset: golem-linux-x86_64
            features: ""
          - os: macos-latest
            asset: golem-macos-arm64
            features: --features desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release ${{ matrix.features }} --manifest-path golem-rs/Cargo.toml
      - name: Package
        shell: bash
        run: |
          src=golem-rs/target/release/golem
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a "${{ matrix.asset }}" "${src}.exe" "${src}w.exe"
          else
            cp "${src}" "${{ matrix.asset }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
