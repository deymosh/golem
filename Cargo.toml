[workspace]
resolver = "2"
members = ["crates/golem", "crates/golem-core"]

[workspace.package]
version = "0.1.6"
edition = "2021"
# 1.81 is the second toolchain installed on the reference box; keep the
# core buildable with it so the MSRV claim is honest.
rust-version = "1.81"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

# The checkout runs a debug build, and golem-core holds the byte-crunching
# (SHA-256 of a 20 GB model, GGUF headers): unoptimised it hashes at ~15 MB/s.
[profile.dev.package.golem-core]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
