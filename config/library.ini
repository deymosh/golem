; Golem's library: the models it knows to be good on a coding box, and what
; for. Compiled into the binary; a config/library.ini in the home takes its
; place.
;
; `golem pull <name>` fetches one by name, as its preset if config/models.ini
; already has that section, otherwise from its repo, writing the section.
; `golem tune --auto` ranks installed models by `quality`: the vendor's
; SWE-bench Verified score (or the nearest equivalent), with
; `quality-source` saying where it comes from. A score only ranks;
; nothing is adopted without `golem eval --long 200000`.
;
; Keys: repo (owner/repo on Hugging Face), quant (omit to let the machine
; pick), role (coder, everyday, vision, smoke), quality, quality-source.

[ornith-1.5-35b]
repo = ornith-ai/Ornith-1.5-35B-A3B-GGUF
quant = Q4_K_M
role = coder
quality = 79
quality-source = SWE-bench Verified, vendor-reported

[qwen3.6-35b-a3b]
repo = unsloth/Qwen3.6-35B-A3B-GGUF
quant = UD-Q4_K_M
role = coder
quality = 73.4
quality-source = SWE-bench Verified, vendor-reported

