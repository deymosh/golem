; Golem engine adapter: llama.cpp mainline (ggml-org) - the default engine.
;
; One file per engine under config/engines/; ENGINE in golem.toml picks it. The
; binary reads it to install the pinned build into
; .local/engines/<name>/<build>-<backend>/ and to decide how to start it.
; Keys:
;   build             pinned release tag (gated: 200K eval PASS before bumping);
;                     ENGINE_BUILD in golem.toml overrides, "latest" follows upstream
;   <platform>_repo   GitHub owner/repo whose releases carry this platform's
;                     archives - `windows_repo`, `linux_repo`, `macos_repo`.
;                     The platform is read from the machine, never configured.
;   <platform>_asset_*   regex of the server archive per GPU backend
;                     (cuda / rocm / vulkan / metal)
;   <platform>_runtime_* regex of an extra runtime archive extracted next to it
;                     (llama.cpp's CUDA build ships its cudart separately)
;   <platform>_libraries_<backend>  URL of an archive, outside the release,
;                     holding libraries the backend's build loads and its
;                     archive lacks; fetched into data/cache when they are not
;                     beside the server, with
;     ..._sha256      its SHA-256 (required: anything else is refused)
;     ..._from        the folder inside it the libraries are in
;     ..._files       the files and folders taken from there, placed beside
;                     the server
;   server            server executable, without the platform's extension
;   api_anthropic     serves /v1/messages (required for golem claude)
;   router            understands --models-preset (else: single-model, the
;                     default section's flags become the command line)
;   log_file_adds_ext the server appends ".log" to --log-file itself
;   list_devices      the server answers --list-devices with the GPUs it can
;                     offload to; golem asks before each start, and a run
;                     with none is not recorded
;   flag.<key>        rename a canonical (llama.cpp) flag; "-" drops it with a
;                     warning. Applies to golem.s own flags; preset
;                     flags are only translated when router = false (in router
;                     mode the engine reads the preset itself).
;   map.<key>.<value> replace that exact flag+value with other args ("-"
;                     drops it), e.g. map.load-mode.mlock = --mlock
;   served.<backend>.<key>.<value>  the value that preset line is served
;                     with on that backend: the engine reads the preset
;                     rewritten (data/tuned/models.served.ini), and so does
;                     a tune's gate, because this build cannot load it as
;                     written there

name = llama.cpp
build = b11379
windows_repo = ggml-org/llama.cpp
windows_asset_cuda = ^llama-.*bin-win-cuda-13\.\d+-x64\.zip$
windows_runtime_cuda = ^cudart-llama-bin-win-cuda-13\.\d+-x64\.zip$
windows_asset_rocm = ^llama-.*bin-win-rocm-\d+\.\d+-x64\.zip$
; The Windows ROCm zip carries the HIP runtime (amdhip64_7.dll) but not the
; BLAS libraries its ggml-hip.dll imports. AMD publishes them for Windows in
; its ROCm SDK wheels; this one is ROCm 7.2.1, the major the zip's
; amdhip64_7.dll is. The files are what ggml-hip.dll loads through
; hipblas.dll (rocblas, rocsolver, libhipblaslt) and the kernels rocBLAS and
; hipBLASLt read from folders beside them - not MIOpen, rocRAND and the rest
; of the wheel. Proven on this repo's NVIDIA box up to "every imported HIP
; function resolves against the zip's DLLs"; not yet on an AMD card.
windows_libraries_rocm = https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl
windows_libraries_rocm_sha256 = c7fe0b0731af8896093ff69e11496830d3cb6a4aed73e895c60b7cbdc200be92
windows_libraries_rocm_from = _rocm_sdk_libraries_custom/bin
windows_libraries_rocm_files = hipblas.dll rocblas.dll rocsolver.dll libhipblaslt.dll rocblas hipblaslt
windows_asset_vulkan = ^llama-.*bin-win-vulkan-x64\.zip$
; The same release ships the Linux archives, and they are .tar.gz - so GNU tar
; reads them and the Windows zip's bsdtar detour does not apply here.
linux_repo = ggml-org/llama.cpp
linux_asset_cuda = ^llama-.*bin-ubuntu-cuda-13\.\d+-x64\.tar\.gz$
; The Linux cudart archive carries the build tag (cudart-llama-b11379-bin-...),
; where the Windows one does not (cudart-llama-bin-win-...) - so the tag is
; eaten by the .* rather than spelled out.
linux_runtime_cuda = ^cudart-llama-.*bin-ubuntu-cuda-13\.\d+-x64\.tar\.gz$
linux_asset_rocm = ^llama-.*bin-ubuntu-rocm-\d+\.\d+-x64\.tar\.gz$
linux_asset_vulkan = ^llama-.*bin-ubuntu-vulkan-x64\.tar\.gz$
macos_repo = ggml-org/llama.cpp
macos_asset_metal = ^llama-.*bin-macos-.*\.tar\.gz$
; b11379 locks a model's host weights from one base address, and under Vulkan
; a host buffer over 4 GiB (the 35B with its experts in RAM) is a
; multi_buffer with none: `load-mode = mlock` aborts the load with
; GGML_ASSERT(addr) in llama-mmap.cpp. `mmap+mlock` pins the same weights
; through the mapping and loads. Fixed upstream after b11379 (PR 30926); this
; line goes when the build moves past it.
served.vulkan.load-mode.mlock = mmap+mlock
server = llama-server
api_anthropic = true
api_openai = true
router = true
list_devices = true
mtp = true
fit = true
tune = true
