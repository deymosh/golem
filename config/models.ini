; Golem - model presets for llama-server router mode.
;
; Enabled by MODELS_PRESET="config/models.ini" in .env. One server, several
; models; each request is routed by its "model" field to the section of the
; same name, which is loaded on first use. With --models-max 1 (set by the
; launchers) asking for another model unloads the current one first, and
; SLEEP_IDLE_SECONDS unloads whatever is loaded once the server goes idle.
;
; Keys are llama-server flags without the leading dashes. Model files are
; relative to data/models/ (the launchers start the server there, in every
; deploy mode). host, port, api-key, threads, parallel and the sleep timer
; come from .env on the command line and apply to all models; everything
; per-model belongs here. In router mode MODEL_FILE / DRAFT_FILE / CONTEXT_SIZE
; / EXTRA_ARGS in .env are NOT used for serving (./golem pull still reads
; HF_REPO / MODEL_FILE).
;
; Each section also carries "; Download: <repo> -> <file>" comments, one per
; GGUF it needs: the launchers (./golem up, golem.cmd, start-windows.ps1)
; read them and fetch anything data/models is missing on first start.

version = 1

[*]
jinja = true
flash-attn = on
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0

; Coder - the default. Set MODEL_ALIAS="qwen3.6-35b-a3b" in .env so
; ./golem claude / env / bench / eval target this section. Same tuning as
; the single-model setup in .env.example (see docs/models.md for the
; measurements).
; Download: unsloth/Qwen3.6-35B-A3B-GGUF -> Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
; Download: bartowski/Qwen_Qwen3.6-35B-A3B-GGUF -> mtp-Qwen_Qwen3.6-35B-A3B-Q4_0.gguf
[qwen3.6-35b-a3b]
model = Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
spec-type = draft-mtp
spec-draft-model = mtp-Qwen_Qwen3.6-35B-A3B-Q4_0.gguf
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 36
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; Everyday assistant that fits entirely in VRAM (~7 GB at 32K), so
; the PC stays usable: summaries, shell/curl one-liners, quick questions.
; Thinking is switched off: quick answers instead of a reasoning preamble,
; and it avoids the tool-call-inside-reasoning bug (llama.cpp #20837).
; Sampling: Qwen's non-thinking defaults.
; Download: unsloth/Qwen3.5-9B-GGUF -> Qwen3.5-9B-UD-Q4_K_XL.gguf
[qwen3.5-9b]
model = Qwen3.5-9B-UD-Q4_K_XL.gguf
ctx-size = 65536
chat-template-kwargs = {"enable_thinking": false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
