; Golem - model presets for llama-server router mode.
;
; Served when golem.toml sets MODELS_PRESET = "config/models.ini" (or the
; tuned copy, data/tuned/models.effective.ini, which is this file with this
; machine's gated overlays merged in). One server, several models: each
; request is routed by its "model" field to the section of the same name,
; which is loaded on first use. golem starts the router with --models-max 1,
; so asking for another model unloads the current one first, and
; SLEEP_IDLE_SECONDS unloads whatever is loaded once the server goes idle.
;
; Keys are llama-server flags without the leading dashes. Model files are
; relative to data/models/ (the server starts there). host, port, api-key,
; threads, parallel and the sleep timer come from golem.toml on the command
; line and apply to all models; everything per-model belongs here. In router
; mode MODEL_FILE / DRAFT_FILE / CONTEXT_SIZE / EXTRA_ARGS in golem.toml are
; not used for serving (golem pull still reads HF_REPO / MODEL_FILE).
;
; Each section also carries "; Download: <repo> -> <file>" comments, one per
; file it needs: golem up reads them and fetches what data/models lacks for
; the default section (MODEL_ALIAS); golem pull <section> fetches any other.
; golem pull owner/repo[:quant] writes a section with its own.
;
; Two models, one for each job: the best coder this class of machine (12 GB
; card, 32 GB RAM) serves at Claude Code's 200K window, and a light everyday
; model that fits on the card. Both read images: the vision projector runs on
; the CPU (no-mmproj-offload), so it costs RAM, not the VRAM the context is
; sized from. Other models are a pull away: config/library.ini lists them,
; and docs/models.md has what was measured.

version = 1

[*]
jinja = true
flash-attn = on
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0

; The coder, and the default (MODEL_ALIAS = "ornith-1.5-35b" in golem.toml).
; Ornith 1.5 35B-A3B (MIT): a Qwen3.5-MoE skeleton (256 experts, 8 per token,
; 40 layers, 30 linear-attention + 10 full), 262K trained context, vendor
; SWE-bench Verified 79. The GGUF embeds its MTP head (blk.40.nextn.*), so
; draft-mtp needs no draft file. Most experts stay in RAM (n-cpu-moe); the
; tuner sets the split and the context for the machine at hand.
; Download: ornith-ai/Ornith-1.5-35B-A3B-GGUF -> Ornith-1.5-35B-Q4_K_M.gguf
; Download: ornith-ai/Ornith-1.5-35B-A3B-GGUF -> mmproj-Ornith-1.5-35B-BF16.gguf
[ornith-1.5-35b]
model = Ornith-1.5-35B-Q4_K_M.gguf
mmproj = mmproj-Ornith-1.5-35B-BF16.gguf
no-mmproj-offload = true
spec-type = draft-mtp
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 36
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; Everyday: summaries, shell one-liners, quick questions and code, with the
; desktop still usable. Ornith 1.5 9B (MIT, dense, Qwen3.5-based), vendor
; SWE-bench Verified 70.6. The whole model sits on the card, and its own MTP
; head drafts for it. Sampling is the model card's "precise coding" preset.
; Download: ornith-ai/Ornith-1.5-9B-GGUF -> Ornith-1.5-9B-Q4_K_M.gguf
; Download: ornith-ai/Ornith-1.5-9B-GGUF -> mmproj-Ornith-1.5-9B-BF16.gguf
[ornith-1.5-9b]
model = Ornith-1.5-9B-Q4_K_M.gguf
mmproj = mmproj-Ornith-1.5-9B-BF16.gguf
no-mmproj-offload = true
spec-type = draft-mtp
ctx-size = 32768
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0

; A tiny model for smoke tests: Qwen2.5-0.5B-Instruct Q4_K_M (397 MB). It
; loads in seconds, so the bench, tune and console plumbing can be exercised
; without waiting on a 20 GB file. Never a default.
; Download: bartowski/Qwen2.5-0.5B-Instruct-GGUF -> Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
[qwen2.5-0.5b-instruct]
model = Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
ctx-size = 8192
load-mode = mlock
n-cpu-moe = 0
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; Pulled from unsloth/flint-GGUF (UD-Q3_K_XL).
; Download: unsloth/flint-GGUF -> flint-UD-Q3_K_XL.gguf
[flint]
model = flint-UD-Q3_K_XL.gguf
ctx-size = 32768
load-mode = mmap+mlock
batch-size = 2048
ubatch-size = 2048
temp = 1.0
top-p = 0.95
top-k = 20
