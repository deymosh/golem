; Golem - model presets for llama-server router mode.
;
; Enabled by MODELS_PRESET="config/models.ini" in .env. One server, several
; models; each request is routed by its "model" field to the section of the
; same name, which is loaded on first use. With --models-max 1 (set by the
; launchers) asking for another model unloads the current one first, and
; SLEEP_IDLE_SECONDS unloads whatever is loaded once the server goes idle.
;
; Keys are llama-server flags without the leading dashes. Model files are
; relative to data/models/ (the launchers start the server there, in every
; deploy mode). host, port, api-key, threads, parallel and the sleep timer
; come from .env on the command line and apply to all models; everything
; per-model belongs here. In router mode MODEL_FILE / DRAFT_FILE / CONTEXT_SIZE
; / EXTRA_ARGS in .env are NOT used for serving (./golem pull still reads
; HF_REPO / MODEL_FILE).
;
; Each section also carries "; Download: <repo> -> <file>" comments, one per
; GGUF it needs: the launchers (./golem up, golem.cmd, start-windows.ps1)
; read them and fetch anything data/models is missing on first start.
;
; Optional: "; Quality: <score>" - the vendor's SWE-bench Verified number (or
; equivalent) for that model. ./golem tune --auto uses it to rank installed
; models when picking "the smartest one this machine can run". It is a
; RANKING input only: adoption still needs the eval gate, and a preset we
; would not recommend (a worse quant of the same model, a smoke test) simply
; carries no score, so it can never outrank a recommended one.

version = 1

[*]
jinja = true
flash-attn = on
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0

; Coder - the previous default, kept as fallback. MODEL_ALIAS="qwen3.6-35b-a3b" so
; ./golem claude / env / bench / eval target this section. Same tuning as
; the single-model setup in .env.example (see docs/models.md for the
; measurements).
; Download: unsloth/Qwen3.6-35B-A3B-GGUF -> Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
; Download: bartowski/Qwen_Qwen3.6-35B-A3B-GGUF -> mtp-Qwen_Qwen3.6-35B-A3B-Q4_0.gguf
; Quality: 73.4
[qwen3.6-35b-a3b]
model = Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
spec-type = draft-mtp
spec-draft-model = mtp-Qwen_Qwen3.6-35B-A3B-Q4_0.gguf
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 36
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; Coder - the default (set MODEL_ALIAS="ornith-1.5-35b" in .env). Adopted
; 2026-10-19 after bench + eval gate, see docs/models.md.
; Ornith 1.5 35B-A3B (MIT) — self-improvement-trained on a Qwen3.5 skeleton:
; same qwen3_5_moe arch (256 experts, 8/tok, 40 layers, hybrid attention
; 30 linear + 10 full), 262K native ctx, Q4_K_M 21.71 GB ≈ Qwen3.6's footprint.
; Vendor claims SWE-V 79 vs 73.4, SWE-Pro 59.6 vs 49.5, Terminal-Bench 67.8 vs
; 52.5 — self-reported, gate with ./golem eval. The GGUF embeds the MTP head
; (blk.40.nextn.* tensors verified in the file), so draft-mtp needs no separate
; draft file. Watch MTP acceptance in ./golem bench — community reports of an
; untrained stock head would show as ~0 acceptance — measured 66%, fine.
; Download: ornith-ai/Ornith-1.5-35B-A3B-GGUF -> Ornith-1.5-35B-Q4_K_M.gguf
; Quality: 79
[ornith-1.5-35b]
model = Ornith-1.5-35B-Q4_K_M.gguf
spec-type = draft-mtp
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 36
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; EXPERIMENT (branch experiment/token-machine): candidate coder, NVIDIA's
; week drop. Nemotron 3.5 Lightning 30B-A3B (MoE 30B total / 3B active, same
; class as Qwen3.6-35B-A3B) — up to 1M native ctx (capped at the coder's 231K
; here), thinking mode with temp 0.6 / top-p 0.95 / min-p 0.01 per unsloth's
; guide. MTP: supported via dedicated DFlash/DSpark draft models, none wired
; yet (unclear whether the main GGUF embeds a usable head — check with
; ./golem bench before adding one). Offload profile copied from the coder:
; Q4_K_M ~17 GB, so --n-cpu-moe keeps experts in RAM; 30 is a guess until
; ./golem bench sweeps it. Released 2026-10-15: arch support in the pinned
; b11379 build is unverified — if the load errors with unknown architecture,
; bump ENGINE_BUILD and re-run the eval gate.
; Download: unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF -> NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf
; Quality: 52
[nemotron-3.5-lightning-30b]
model = NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_M.gguf
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 30
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-p = 0.95
min-p = 0.01

; EXPERIMENT, variant B: same model, APEX-Compact quant (17.44 GB, expert-
; gradient precision, first/last layers + shared expert kept high), MTP head
; bundled as blk.40 at Q8_0. Compared against the official Q4_K_M (which also
; embeds the head): smaller RAM footprint vs quant quality — bench + eval
; decide. Measured 2026-10-19: passes eval but the bundled head accepts 32%
; → 39 t/s decode vs 59.5 for the official quant; not adopted.
; Download: mudler/Ornith-1.5-35B-A3B-APEX-MTP-GGUF -> Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
[ornith-1.5-35b-mtp]
model = Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
spec-type = draft-mtp
ctx-size = 236544
load-mode = mlock
n-cpu-moe = 36
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0

; Everyday assistant that fits entirely in VRAM (~7 GB at 32K), so
; the PC stays usable: summaries, shell/curl one-liners, quick questions.
; Thinking is switched off: quick answers instead of a reasoning preamble,
; and it avoids the tool-call-inside-reasoning bug (llama.cpp #20837).
; Sampling: Qwen's non-thinking defaults.
; Download: unsloth/Qwen3.5-9B-GGUF -> Qwen3.5-9B-UD-Q4_K_XL.gguf
[qwen3.5-9b]
model = Qwen3.5-9B-UD-Q4_K_XL.gguf
ctx-size = 65536
chat-template-kwargs = {"enable_thinking": false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0



; Added from the web console 2026-10-19: Qwen2.5-0.5B-Instruct Q4_K_M (397 MB).
; A tiny dense model kept for smoke tests: it loads in seconds, so the bench,
; tune and console plumbing can be exercised without waiting on a 20 GB file.
; Download: bartowski/Qwen2.5-0.5B-Instruct-GGUF -> Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
[qwen2.5-0.5b-instruct]
model = Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
ctx-size = 8192
load-mode = mlock
n-cpu-moe = 0
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-k = 20
min-p = 0
